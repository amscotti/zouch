name: Nightly integration

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integration
  cancel-in-progress: true

jobs:
  couchdb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      # CouchDB must share the runner's network namespace: the replication
      # suites make CouchDB replicate to the Zouch process running on the
      # runner at 127.0.0.1:6050/7090. A bridged service container has its own
      # loopback, so those targets get econnrefused (Linux has no Docker
      # Desktop host.docker.internal fallback).
      - name: Start CouchDB
        run: |
          docker run -d --name couchdb --network host \
            -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=zouchtestpw \
            couchdb:3.5.3

      - name: Wait for CouchDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -u admin:zouchtestpw http://127.0.0.1:5984/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "CouchDB did not become ready" >&2
          exit 1

      - name: Local quality gate
        run: ./scripts/ci.sh

      - name: CouchDB-backed replication
        run: ./scripts/integration.sh
