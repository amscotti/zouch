name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            target: x86_64-linux-gnu
          - os: ubuntu-24.04
            artifact: linux-aarch64
            target: aarch64-linux-gnu
          - os: macos-latest
            artifact: macos-aarch64
            target: aarch64-macos
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package tarball and checksum
        run: |
          mkdir -p dist/zouch
          cp zig-out/bin/zouch README.md LICENSE dist/zouch/
          archive="zouch-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz"
          tar -C dist -czf "dist/${archive}" zouch
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archive}" > "${archive}.sha256"
            else
              shasum -a 256 "${archive}" > "${archive}.sha256"
            fi
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
